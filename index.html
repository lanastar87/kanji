<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>한자 학습 퀴즈 및 복습노트</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Noto+Serif+KR:wght@400;700&family=Pretendard:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Pretendard', sans-serif;
        }
        .hanzi-font {
            font-family: 'Noto Serif KR', serif;
        }
        /* Custom scrollbar */
        ::-webkit-scrollbar {
            width: 6px;
            height: 6px;
        }
        ::-webkit-scrollbar-track {
            background: #f1f1f1;
            border-radius: 4px;
        }
        ::-webkit-scrollbar-thumb {
            background: #cbd5e1;
            border-radius: 4px;
        }
        ::-webkit-scrollbar-thumb:hover {
            background: #94a3b8;
        }
    </style>
</head>
<body class="bg-slate-50 text-slate-800 min-h-screen flex flex-col justify-between">

    <!-- Header -->
    <header class="bg-indigo-900 text-white shadow-lg sticky top-0 z-50">
        <div class="max-w-4xl mx-auto px-4 py-3 flex justify-between items-center">
            <div class="flex items-center space-x-3">
                <div class="bg-amber-500 text-indigo-950 font-bold p-2 rounded-lg text-xl flex items-center justify-center w-10 h-10 shadow">
                    漢
                </div>
                <div>
                    <h1 class="font-bold text-lg leading-tight">매일 한자 암기</h1>
                    <p class="text-xs text-indigo-200">한자 실력을 차곡차곡 올려보세요</p>
                </div>
            </div>
            
            <!-- Navigation Tabs (Practice removed) -->
            <nav class="flex space-x-1 bg-indigo-950/50 p-1 rounded-xl text-sm font-medium">
                <button id="nav-quiz" onclick="switchTab('quiz')" class="px-3 py-1.5 rounded-lg bg-indigo-600 text-white transition-all">암기 퀴즈</button>
                <button id="nav-note" onclick="switchTab('note')" class="px-3 py-1.5 rounded-lg hover:text-indigo-200 text-indigo-300 transition-all">복습 노트 <span id="wrong-count-badge" class="bg-rose-500 text-white text-xs px-1.5 py-0.5 rounded-full hidden">0</span></button>
            </nav>
        </div>
    </header>

    <!-- Main Content Container -->
    <main class="max-w-4xl w-full mx-auto p-4 flex-grow">
        
        <!-- ================= QUIZ SECTION ================= -->
        <section id="section-quiz" class="space-y-6">
            <!-- Stats Dashboard -->
            <div class="grid grid-cols-1 sm:grid-cols-3 gap-4">
                <!-- Stats: Total Answered -->
                <div class="bg-white p-4 rounded-2xl shadow-sm border border-slate-200 flex items-center space-x-4">
                    <div class="p-3 bg-indigo-50 text-indigo-600 rounded-xl">
                        <i class="fa-solid fa-layer-group text-2xl"></i>
                    </div>
                    <div>
                        <div class="text-xs text-slate-500 font-medium">학습한 횟수</div>
                        <div id="stat-total" class="text-2xl font-bold text-slate-800">0</div>
                    </div>
                </div>

                <!-- Stats: Known Count -->
                <div class="bg-white p-4 rounded-2xl shadow-sm border border-slate-200 flex items-center space-x-4">
                    <div class="p-3 bg-emerald-50 text-emerald-600 rounded-xl">
                        <i class="fa-solid fa-circle-check text-2xl"></i>
                    </div>
                    <div>
                        <div class="text-xs text-slate-500 font-medium">외운 한자</div>
                        <div id="stat-known" class="text-2xl font-bold text-slate-800">0</div>
                    </div>
                </div>

                <!-- Stats: Review Count -->
                <div class="bg-white p-4 rounded-2xl shadow-sm border border-slate-200 flex items-center space-x-4">
                    <div class="p-3 bg-rose-50 text-rose-600 rounded-xl">
                        <i class="fa-solid fa-bookmark text-2xl"></i>
                    </div>
                    <div>
                        <div class="text-xs text-slate-500 font-medium">복습 필요한 한자</div>
                        <div id="stat-review" class="text-2xl font-bold text-slate-800">0</div>
                    </div>
                </div>
            </div>

            <!-- Flashcard Card -->
            <div class="bg-white rounded-3xl shadow-md border border-slate-200 overflow-hidden relative">
                <div class="p-6 md:p-12 text-center flex flex-col items-center min-h-[380px] justify-between">
                    
                    <span class="inline-block px-3 py-1 bg-indigo-50 text-indigo-700 font-semibold text-xs rounded-full">
                        뜻/음 암기 확인
                    </span>
                    
                    <!-- Hanzi Display -->
                    <div class="relative group my-6">
                        <div id="quiz-hanzi" class="hanzi-font text-8xl md:text-9xl font-bold text-slate-800 tracking-wider transition-transform duration-200 transform group-hover:scale-105">
                            -
                        </div>
                        <button onclick="copyCurrentHanzi()" title="한자 복사" class="absolute -right-8 top-0 text-slate-300 hover:text-indigo-600 transition-colors p-2">
                            <i class="fa-regular fa-copy"></i>
                        </button>
                    </div>

                    <!-- Answer Display Box (Hidden by default) -->
                    <div id="answer-box" class="w-full max-w-md bg-amber-50/80 border-2 border-amber-200 rounded-2xl p-4 my-2 hidden transition-all">
                        <div class="text-xs text-amber-700 font-medium mb-1">훈음 (뜻과 소리)</div>
                        <div id="answer-meaning" class="text-2xl md:text-3xl font-bold text-indigo-950 hanzi-font">
                            -
                        </div>
                    </div>

                    <p id="prompt-text" class="text-slate-400 text-sm my-2">머릿속으로 뜻과 음을 먼저 생각해보세요!</p>

                    <!-- Action Controls Container -->
                    <div id="control-area" class="w-full max-w-md mt-4">
                        <!-- Button 1: Reveal Answer -->
                        <button id="reveal-btn" onclick="revealAnswer()" class="w-full py-4 bg-indigo-600 hover:bg-indigo-700 text-white font-bold rounded-2xl shadow-lg hover:shadow-xl transition-all flex items-center justify-center space-x-2 text-lg">
                            <i class="fa-solid fa-eye"></i>
                            <span>정답 확인하기</span>
                        </button>

                        <!-- Evaluation Buttons: "잘 모르겠어요" & "알고 있어요!" -->
                        <div id="evaluation-btns" class="grid grid-cols-2 gap-4 hidden">
                            <button onclick="handleEvaluation(false)" class="py-4 bg-rose-50 hover:bg-rose-100 text-rose-700 border-2 border-rose-200 font-bold rounded-2xl transition-all flex items-center justify-center space-x-2">
                                <i class="fa-solid fa-xmark text-xl"></i>
                                <span>잘 모르겠어요</span>
                            </button>
                            <button onclick="handleEvaluation(true)" class="py-4 bg-emerald-600 hover:bg-emerald-700 text-white font-bold rounded-2xl shadow-md transition-all flex items-center justify-center space-x-2">
                                <i class="fa-solid fa-check text-xl"></i>
                                <span>알고 있어요!</span>
                            </button>
                        </div>
                    </div>

                </div>
            </div>
        </section>

        <!-- ================= INCORRECT NOTE SECTION ================= -->
        <section id="section-note" class="hidden space-y-4">
            <div class="bg-white p-6 rounded-2xl shadow-sm border border-slate-200 flex justify-between items-center">
                <div>
                    <h2 class="text-xl font-bold text-slate-800">복습 노트</h2>
                    <p class="text-sm text-slate-500">'잘 모르겠어요'를 선택했던 한자 모음입니다.</p>
                </div>
                <button onclick="clearWrongNotes()" class="px-3 py-1.5 text-xs text-rose-600 border border-rose-200 hover:bg-rose-50 rounded-xl font-medium transition-colors">
                    전체 삭제
                </button>
            </div>

            <div id="wrong-list" class="grid grid-cols-1 sm:grid-cols-2 md:grid-cols-3 gap-4">
                <!-- Wrong items populated dynamically -->
            </div>

            <div id="wrong-empty" class="bg-white p-12 rounded-2xl border border-dashed border-slate-300 text-center">
                <div class="text-slate-300 text-5xl mb-3"><i class="fa-solid fa-circle-check"></i></div>
                <h3 class="text-slate-600 font-bold">복습할 한자가 없습니다!</h3>
                <p class="text-slate-400 text-sm mt-1">퀴즈를 풀면서 '잘 모르겠어요'를 누른 한자가 여기에 저장됩니다.</p>
            </div>
        </section>

    </main>

    <!-- Footer -->
    <footer class="bg-white border-t border-slate-200 py-4 mt-8">
        <div class="max-w-4xl mx-auto px-4 text-center text-xs text-slate-400">
            &copy; 매일 한자 학습 프로젝트
        </div>
    </footer>

    <!-- Notification Toast -->
    <div id="toast" class="fixed bottom-6 right-6 bg-slate-800 text-white text-sm px-4 py-3 rounded-xl shadow-xl opacity-0 transition-opacity pointer-events-none z-50 flex items-center space-x-2">
        <i class="fa-solid fa-circle-info text-indigo-400"></i>
        <span id="toast-message">알림 메시지</span>
    </div>

    <script>
        /* ================= 문제 데이터 =================
           아래 HANZI_DATA 배열에 원하시는 한자와 뜻/음만 간단히 작성하시면 됩니다.
           - hanzi: 화면에 표시될 한자
           - mean: 정답 (뜻과 음)
        ================================================= */
        const HANZI_DATA = [
            { hanzi: "日", mean: "날 일" },
            { hanzi: "月", mean: "달 월" },
            { hanzi: "火", mean: "불 화" },
            { hanzi: "水", mean: "물 수" },
            { hanzi: "木", mean: "나무 목" },
            { hanzi: "金", mean: "쇠 금 / 성 김" },
            { hanzi: "土", mean: "흙 토" },
            { hanzi: "學", mean: "배울 학" },
            { hanzi: "校", mean: "학교 교" },
            { hanzi: "家", mean: "집 가" }
        ];

        // App State
        let currentQuestion = null;
        let isRevealed = false;
        
        let stats = {
            total: 0,
            known: 0
        };

        let wrongAnswers = JSON.parse(localStorage.getItem("hanzi_wrong_notes") || "[]");

        window.onload = function() {
            loadStats();
            updateWrongBadge();
            generateQuestion();
        };

        function generateQuestion() {
            isRevealed = false;
            
            // Pick a random question
            const randomIndex = Math.floor(Math.random() * HANZI_DATA.length);
            currentQuestion = HANZI_DATA[randomIndex];

            // Render Hanzi
            document.getElementById("quiz-hanzi").innerText = currentQuestion.hanzi;
            document.getElementById("answer-meaning").innerText = currentQuestion.mean;

            // Reset UI Visibility
            document.getElementById("answer-box").classList.add("hidden");
            document.getElementById("prompt-text").classList.remove("hidden");
            document.getElementById("reveal-btn").classList.remove("hidden");
            document.getElementById("evaluation-btns").classList.add("hidden");
        }

        function revealAnswer() {
            if (isRevealed) return;
            isRevealed = true;

            // Show answer box & evaluation buttons
            document.getElementById("answer-box").classList.remove("hidden");
            document.getElementById("prompt-text").classList.add("hidden");
            document.getElementById("reveal-btn").classList.add("hidden");
            document.getElementById("evaluation-btns").classList.remove("hidden");
        }

        function handleEvaluation(isKnown) {
            stats.total++;

            if (isKnown) {
                stats.known++;
                showToast("외운 한자로 기록되었습니다!");
            } else {
                addWrongNote(currentQuestion);
                showToast("복습 노트에 추가되었습니다.");
            }

            saveStats();
            updateStatsUI();
            generateQuestion();
        }

        function saveStats() {
            localStorage.setItem("hanzi_stats_flashcard", JSON.stringify(stats));
        }

        function loadStats() {
            const saved = localStorage.getItem("hanzi_stats_flashcard");
            if (saved) {
                stats = JSON.parse(saved);
            }
            updateStatsUI();
        }

        function updateStatsUI() {
            document.getElementById("stat-total").innerText = stats.total;
            document.getElementById("stat-known").innerText = stats.known;
            document.getElementById("stat-review").innerText = wrongAnswers.length;
        }

        function addWrongNote(item) {
            if (!wrongAnswers.some(w => w.hanzi === item.hanzi)) {
                wrongAnswers.push(item);
                localStorage.setItem("hanzi_wrong_notes", JSON.stringify(wrongAnswers));
                updateWrongBadge();
                renderWrongNotes();
            }
        }

        function removeWrongNote(hanzi) {
            wrongAnswers = wrongAnswers.filter(w => w.hanzi !== hanzi);
            localStorage.setItem("hanzi_wrong_notes", JSON.stringify(wrongAnswers));
            updateWrongBadge();
            renderWrongNotes();
            updateStatsUI();
            showToast("복습 노트에서 삭제되었습니다.");
        }

        function clearWrongNotes() {
            if (wrongAnswers.length === 0) return;
            wrongAnswers = [];
            localStorage.setItem("hanzi_wrong_notes", JSON.stringify(wrongAnswers));
            updateWrongBadge();
            renderWrongNotes();
            updateStatsUI();
            showToast("복습 노트가 초기화되었습니다.");
        }

        function updateWrongBadge() {
            const badge = document.getElementById("wrong-count-badge");
            if (wrongAnswers.length > 0) {
                badge.innerText = wrongAnswers.length;
                badge.classList.remove("hidden");
            } else {
                badge.classList.add("hidden");
            }
        }

        function renderWrongNotes() {
            const container = document.getElementById("wrong-list");
            const emptyMsg = document.getElementById("wrong-empty");

            if (wrongAnswers.length === 0) {
                container.innerHTML = "";
                emptyMsg.classList.remove("hidden");
                return;
            }

            emptyMsg.classList.add("hidden");
            container.innerHTML = "";

            wrongAnswers.forEach(item => {
                const card = document.createElement("div");
                card.className = "bg-white p-5 rounded-2xl border border-slate-200 shadow-sm flex items-center justify-between";
                card.innerHTML = `
                    <div class="flex items-center space-x-4">
                        <span class="hanzi-font text-4xl font-bold text-slate-800">${item.hanzi}</span>
                        <div>
                            <div class="font-bold text-indigo-900 text-lg">${item.mean}</div>
                        </div>
                    </div>
                    <button onclick="removeWrongNote('${item.hanzi}')" class="text-slate-300 hover:text-rose-500 p-2 transition-colors">
                        <i class="fa-solid fa-trash-can"></i>
                    </button>
                `;
                container.appendChild(card);
            });
        }

        function switchTab(tab) {
            const sections = ['quiz', 'note'];
            sections.forEach(s => {
                document.getElementById(`section-${s}`).classList.add("hidden");
                const navBtn = document.getElementById(`nav-${s}`);
                navBtn.className = "px-3 py-1.5 rounded-lg hover:text-indigo-200 text-indigo-300 transition-all";
            });

            document.getElementById(`section-${tab}`).classList.remove("hidden");
            const activeNav = document.getElementById(`nav-${tab}`);
            activeNav.className = "px-3 py-1.5 rounded-lg bg-indigo-600 text-white transition-all";

            if (tab === 'note') {
                renderWrongNotes();
            }
        }

        function copyCurrentHanzi() {
            const hanzi = document.getElementById("quiz-hanzi").innerText;
            if (hanzi && hanzi !== "-") {
                const tempInput = document.createElement("input");
                tempInput.value = hanzi;
                document.body.appendChild(tempInput);
                tempInput.select();
                document.execCommand("copy");
                document.body.removeChild(tempInput);
                showToast(`'${hanzi}' 한자가 클립보드에 복사되었습니다.`);
            }
        }

        function showToast(message) {
            const toast = document.getElementById("toast");
            document.getElementById("toast-message").innerText = message;
            toast.classList.remove("opacity-0", "pointer-events-none");
            toast.classList.add("opacity-100");

            setTimeout(() => {
                toast.classList.remove("opacity-100");
                toast.classList.add("opacity-0", "pointer-events-none");
            }, 2500);
        }
    </script>
</body>
</html>
